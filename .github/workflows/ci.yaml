name: CI

# deputy's own test + lint gate. The whole point of the package is that its CI
# logic is testable without a live Actions run — so this just installs it and
# runs pytest + ruff.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deputy + dev tools
        run: pip install -e . pytest ruff

      - name: Lint
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: Test
        run: pytest -q
