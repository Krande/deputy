[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deputy"
version = "0.4.0"
description = "Your repo's CI deputy — PR checks, release tagging, and gitops image bumps as testable Python, not logic buried in Actions YAML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # semantic-release is invoked as a subprocess by the version/release
    # helpers, so installing deputy puts it on PATH for the workflows.
    "python-semantic-release==8.5.1",
    # comment-preserving YAML edits for the gitops-update command.
    "ruamel.yaml>=0.17",
    # write the rendered semantic-release config (tomllib reads, tomli-w writes).
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deputy = "deputy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deputy"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001: the ℹ️/✅/❌ glyphs in the PR-comment strings are intentional.
ignore = ["E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── pixi-build: lets `pixi global install deputy --git <url> --tag vX.Y.Z`
# build + install deputy as a single command (no uv/pipx needed). deputy's three
# runtime deps are all on conda-forge, so they resolve as conda run-deps here.
# (preview feature — see https://pixi.sh/latest/build/)
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.host-dependencies]
hatchling = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.12"
python-semantic-release = "==8.5.1"
"ruamel.yaml" = ">=0.17"
tomli-w = ">=1.0"
